name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET (global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HrSync.slnx

      - name: Build
        run: dotnet build HrSync.slnx --no-restore -c Release

      # VSTest runner (xunit 2 + Microsoft.NET.Test.Sdk), so --filter uses VSTest syntax.
      # E2E (Aspire AppHost) needs Azure Functions Core Tools and stays local-only.
      # Integration tests run: Testcontainers starts Azurite on the runner's Docker engine.
      - name: Test
        run: >-
          dotnet test HrSync.slnx --no-build -c Release
          --filter "Category!=E2E"
          --logger trx
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Test summary
        if: always()
        run: python3 .github/scripts/trx_summary.py TestResults >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14
